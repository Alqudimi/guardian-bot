[project]
name = "guardian-bot"
version = "0.2.0"
description = "Production-grade Telegram group moderation and security bot"
requires-python = ">=3.11,<3.14"
dependencies = [
    "redis>=5.0,<8",
    "asyncpg>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "Pillow>=10.0,<13",
    "aiohttp>=3.9,<4",
    "httpx>=0.27,<1",
    "python-telegram-bot[rate-limiter,webhooks]>=22,<23",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<27",
    "celery[redis]>=5.3,<6",
    "tldextract>=5.1,<6",
    "regex>=2024.4,<2027",
    "Unidecode>=1.3,<2",
    "psutil>=5.9,<8",
    "tenacity>=8.3,<10",
    "mmh3>=4.0,<6",
    "dnspython>=2.6,<3",
    "yt-dlp>=2024.1.1",
    "instaloader>=4.10,<5",
    "pyrogram>=2.0.106,<3",
    "py-tgcalls>=0.9.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.8,<1",
    "pip-audit>=2.7,<3",
    "aiosqlite>=0.20,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "model_cache", "__pycache__", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF", "TRY", "ASYNC"]
ignore = ["S101"]

[tool.uv]
package = false
